<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
    </head>
        
    <body>
        <!-- ACESSIBILIDADE -->
        <section class="cabecalho__acessibilidade">
            <div class="text-end container-xxl">
                <!-- Botões tamanho fonte -->
                <button type="button" class="btn btn-outline-light fs-6" title="Diminuir fonte" id="diminuir_fonte" title="Diminuir fonte"><i class="bi bi-dash"></i></button>
                <button type="button" class="btn btn-outline-light fs-6" title="Retomar tamanho padrão da fonte" id="retomar_fonte" title="Restaurar tamanho da fonte"><i class="bi bi-fonts"></i></button>
                <button type="button" class="btn btn-outline-light fs-6" title="Aumentar fonte" id="aumentar_fonte" title="Aumentar fonte"><i class="bi bi-plus"></i></button>
                
                <!-- Dropbar alterar padrão de cores -->
                <div class="btn-group" title="Padrões de cores">
                    <button type="button" class="btn btn-outline-light dropdown-toggle" data-bs-toggle="dropdown" aria-expanded="false">
                        <i class="bi bi-palette"></i> Padrão de cores
                    </button>
                    <ul class="dropdown-menu">
                        <li><button onclick="aplicarDaltonismo('normal')" class="dropdown-item">Normal</button></li>
                        <li><button onclick="aplicarDaltonismo('deuteranopia')" class="dropdown-item">Deuteranopia</button></li>
                        <li><button onclick="aplicarDaltonismo('protanopia')" class="dropdown-item">Protanopia</button></li>
                        <li><button onclick="aplicarDaltonismo('tritanopia')" class="dropdown-item">Tritanopia</button></li>
                    </ul>
                </div>

                <!-- Dropbar alterar estilo da fonte -->
                <div class="btn-group" title="Alterar estilo da fonte">
                    <button type="button" class="btn btn-outline-light dropdown-toggle fs-6" data-bs-toggle="dropdown" aria-expanded="false">
                        <i class="bi bi-file-earmark-font"></i> Fonte
                    </button>
                    <ul class="dropdown-menu">
                        <li><button class="dropdown-item" type="button" id="fonte_padrao" style="font-family: sans-serif;">Padrão</button></li>
                        <li><button class="dropdown-item" type="button" id="fonte_serifada" style="font-family: Times New Roman;">Serifada</button></li>
                        <li><button class="dropdown-item" type="button" id="fonte_open" style="font-family: OpenDyslexic;">Open Dyslexic</button></li>
                    </ul>
                </div>
            </div>
        </section>
            
        <header class="fundo__escuro divisoria__bottom">
            <nav class="navbar navbar-expand-lg bg-body-transparent">
                
                <!-- Alinhar os itens -->

                    <div style="flex: 1;">

                    </div>

                    <!-- Search bar -->

                            <button class="btn btn-outline-light flex-shrink-0" type="submit" title="Submeter pesquisa">
                                <img src="../../img/header/lupa.svg" alt="Ícone de lupa" class="cabecalho__icone">
                            </button>
                        </form>
                    </div>

                    <!-- Links de acesso para outras páginas -->
                    <div class="d-flex justify-content-end align-items-center my-2" style="flex: 1;">

                        <!-- Links visíveis só no desktop -->
                        <ul class="navbar-nav d-none d-lg-flex align-items-center">
                            <li class="nav-item">
                                <a class="nav-link active text-white cabecalho__link catalogo__selecionado" href="../catalogo/catalogo.html">Catálogo</a>
                            </li>
                            <li class="nav-item">
                                <a class="nav-link text-white cabecalho__link" href="../forms/form_cadastro_usuario.html">Cadastre-se</a>
                            </li>
                            <li class="nav-item">
                                <a class="nav-link" href="../carrinho/carrinho.html">
                                    <i class="bi bi-cart fs-3 text-white cabecalho__link"></i>
                                </a>
                            </li>
                        </ul>

                        <!-- Botão hamburguer visível só no mobile -->
                        <button class="navbar-toggler d-lg-none" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
                            <span class="navbar-toggler-icon"></span>
                        </button>

                    </div>
                </div>

                <!-- Menu de links mobile -->
                <div class="collapse navbar-collapse d-lg-none px-2" id="navbarSupportedContent">
                    <ul class="navbar-nav w-100 pb-2">
                        <li class="nav-item">
                            <a class="nav-link active text-white cabecalho__link" aria-current="page" href="../catalogo/catalogo.html">Catálogo</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link text-white cabecalho__link" href="../forms/form_cadastro_usuario.html">Cadastre-se</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link text-white cabecalho__link" href="../carrinho/carrinho.html">Carrinho</a>
                        </li>

                        <!-- Search bar -->
                        <div class="justify-content-center" style="flex: 1;">
                            <form class="d-flex py-1 w-100" role="search">
                                <input class="form-control me-2 opacity-75 w-100" type="search" placeholder="Pesquisar"/>
                                <button class="btn btn-outline-light flex-shrink-0" type="submit">
                                    <img src="../../img/header/lupa.svg" alt="Ícone de lupa" class="cabecalho__icone">
                                </button>
                            </form>
                        </div>
                    </ul>
                </div>
            </nav>
        </header> 
        
    </body>
    
    <!-- Filtros de daltonismo -->
    <svg style="display:none" xmlns="http://www.w3.org/2000/svg">
        <defs>
            <!-- Deuteranopia -->
            <filter id="deuteranopia">
                <feColorMatrix type="matrix" values="
                    0.367  0.861 -0.228  0  0
                    0.280  0.673  0.047  0  0
                -0.012  0.043  0.969  0  0
                    0      0      0      1  0"/>
            </filter>

            <!-- Protanopia -->
            <filter id="protanopia">
                <feColorMatrix type="matrix" values="
                    0.152  1.053 -0.205  0  0
                    0.115  0.786  0.099  0  0
                -0.004 -0.048  1.052  0  0
                    0      0      0      1  0"/>
            </filter>

            <!-- Tritanopia -->
            <filter id="tritanopia">
                <feColorMatrix type="matrix" values="
                    1.256 -0.077 -0.179  0  0
                -0.078  0.931  0.148  0  0
                    0.005  0.691  0.304  0  0
                    0      0      0      1  0"/>
            </filter>
        </defs>
    </svg>
