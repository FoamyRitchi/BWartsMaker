<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <!-- Configurações iniciais -->
        <script src="../../js/global/include.js" defer></script>
        <script src="../../js/global/fetch.js" defer></script>
        
        <!-- Estilização -->
        <link rel="stylesheet" href="../styles/perfil.css">
        <link rel="stylesheet" href="perfil_user_visao_geral.css">

        <!-- Animação sidebar -->
        <script src="../../js/perfil_visao_geral/recolherSidebar.js" defer></script>
    </head>

    <body>
        <section id="header"></section>

        <section class="d-flex" style="min-height: 100vh;">
            <!-- SIDEBAR -->
            <nav class="pt-4 d-flex flex-column align-items-center flex-shrink-0" id="sidebar">
                <!-- Botão para recolher a sidebar -->
                <div class="w-100 d-flex justify-content-end pe-3">
                    <button class="botao_recolher" id="botao_recolher_menu">
                        <i class="bi bi-chevron-left" id="sidebar_icone"></i>
                    </button>
                </div>

                <!-- Links para outras páginas -->
                <ul class="p-0 pt-3 w-100 links__sidebar">
                    <li class="pb-2"><span class="fs-5 d-flex flex-wrap fw-bold text-white text-uppercase titulo__sidebar">Páginas - perfil</span></li>
                    <li>
                        <a href="#" class="active">
                            <span class="fs-5 link__sidebar">Visão geral</span>
                        </a>
                    </li>
                    <li>
                        <a href="../perfil_minhas_compras/minhas_compras.html">
                            <span class="fs-5 link__sidebar">Minhas compras</span>
                        </a>
                    </li>
                    <li>
                        <a href="../perfil_suporte/suporte.html">
                            <span class="fs-5 link__sidebar">Suporte</span>
                        </a>
                    </li>
                    <li>
                        <a>
                            <button type="button" id="botao_sair" class="btn link-light p-0 fs-5 link__sidebar"  
                                data-bs-toggle="modal" data-bs-target="#SairConta"
                            >
                                Sair da conta
                            </button>
                        </a>
                    </li>
                </ul>

                <!-- Modal para Sair da conta -->
                <div class="modal fade" id="SairConta" tabindex="-1">
                    <div class="modal-dialog modal-dialog-scrollable">
                        <div class="modal-content">
                            <!-- Header do modal -->
                            <div class="modal-header fundo__escuro">
                                <div class="d-flex justify-content-center modal-body">
                                    <img src="../../img/assets/Logo.svg" alt="Logo da BWarts" style="width: 13rem;">
                                </div>
                                <button id="fechar_modal" type="button" class="btn-close" data-bs-theme="dark" data-bs-dismiss="modal" aria-label="Close"></button>
                            </div>
                            
                            <!-- Corpo do modal -->
                            <div class="modal-body d-flex flex-column align-items-center text-center px-4 py-4 gap-3">
                                <!-- Ícone -->
                                <div class="rounded-circle d-flex align-items-center justify-content-center"
                                    style="width:72px; height:72px; background:#fff5e6; border: 2px solid #FF8E1C;">
                                    <i class="bi bi-box-arrow-right" style="font-size:2rem; color:#FF8E1C;"></i>
                                </div>

                                <!-- Texto -->
                                <div>
                                    <h1 class="fw-bold mb-1 fs-4" style="font-family:'Syne',sans-serif; color:#222;">
                                        Sair da conta?
                                    </h1>
                                </div>

                                <!-- Botões de confirmação -->
                                <div class="modal-body">
                                    <button id="cancelar_saida" type="button" class="btn btn-outline-danger"><i class="bi bi-x-circle-fill"></i> Cancelar</button>
                                    <button id="sair_conta" type="button" class="btn btn-success" data-bs-dismiss="modal"><i class="bi bi-check-circle-fill"></i> Confirmar</button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </nav>

            <!-- Dados do usuário -->
            <main class="flex-grow-1 p-2 p-sm-5">
                <h1 class="h3 fw-bold pb-1 divisoria__titulo">Visão geral</h1>

                <!-- Foto de perfil central -->
                <div class="d-flex justify-content-center my-3">
                    <img src="../../img/perfil/perfil.jpg" alt="Foto de perfil" class="foto__perfil">
                </div>

                <!-- Cards de formulários -->
                <div class="row g-4">
                    <!-- Dados pessoais -->
                    <div class="col-12 col-lg-6">
                        <div class="rounded-4 p-4 h-100 sombra__card">
    
                            <h2 class="fw-bold fs-5 pb-2 divisoria__titulo">Dados pessoais</h2>

                            <!-- Informações de perfil -->
                            <form id="form_editar_perfil" action="#" method="post">
                                <div class="row g-3">
                                    <div class="col-12">
                                        <label>Nome</label>
                                        <input type="text" class="form-control" placeholder="LebronZika123" disabled>
                                    </div>
                                    <div class="col-12">
                                        <label>E-mail</label>
                                        <input type="email" class="form-control" placeholder="LebronZika123@nike.com" disabled>
                                    </div>
                                    <div class="col-12 col-sm-6">
                                        <label>Telefone</label>
                                        <input type="tel" class="form-control" placeholder="(11) 91212-3267" disabled>
                                    </div>
                                    <div class="col-12 col-sm-6">
                                        <label>CPF</label>
                                        <input type="text" class="form-control" placeholder="123.123.123-32" disabled>
                                    </div>
                                    <div class="col-12 col-sm-6">
                                        <label>Data de nascimento</label>
                                        <input type="date" class="form-control" disabled>
                                    </div>
                                    <div class="col-12 col-sm-6">
                                        <label>Gênero</label>
                                        <input type="text" class="form-control" placeholder="Masculino" disabled>
                                    </div>
                                </div>
                            </form>
                        </div>
                    </div>

                    <!-- Endereço -->
                    <div class="col-12 col-lg-6">
                        <div class="rounded-4 p-4 h-100 sombra__card">
                            <div>
                                <h2 class="fw-bold fs-5 pb-2 divisoria__titulo">Endereço</h2>
                                <form id="form_editar_endereco" action="/editar_perfil" method="post">
                                    <div class="row g-3">
                                        <div class="col-8">
                                            <label>CEP</label>
                                            <input type="text" class="form-control" placeholder="12312-123" disabled>
                                        </div>
                                        <div class="col-4">
                                            <label>Número</label>
                                            <input type="text" class="form-control" placeholder="67" disabled>
                                        </div>
                                        <div class="col-12">
                                            <label>Rua</label>
                                            <input type="text" class="form-control" placeholder="Rua dos bobos" disabled>
                                        </div>
                                        <div class="col-12 col-sm-5">
                                            <label>Estado</label>
                                            <input type="text" class="form-control" placeholder="Bahia" disabled>
                                        </div>
                                        <div class="col-12 col-sm-7">
                                            <label>Cidade</label>
                                            <input type="text" class="form-control" placeholder="Xique-Xique" disabled>
                                        </div>
                                        <div class="col-12">
                                            <label>Bairro</label>
                                            <input type="text" class="form-control" placeholder="Jardim das rosas" disabled>
                                        </div>
                                    </div>
                                </form>

                                <p class="lh-1 mt-1" style="color: #999; font-size: 0.75rem;">
                                    As informações do cliente são tratadas em conformidade com a Lei Geral de Proteção de Dados
                                    (LGPD – Lei nº 13.709/2018) e demais legislações aplicáveis.
                                </p>
                            </div>
                            <div class="d-flex justify-content-end mt-3">
                                <button class="btn text-white btn-outline px-3 border-2 botao__preto__laranja">Editar perfil</button>
                            </div>
                        </div>
                    </div>

                </div>
            </main>
        </section>

        <section id="footer"></section>
    </body>
</html>
