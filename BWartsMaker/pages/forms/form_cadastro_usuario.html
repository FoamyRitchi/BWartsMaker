<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <link rel="stylesheet" href="../styles/forms.css">
        
        <!-- Configurações iniciais -->
        <script src="../../js/global/include.js" defer></script>
        <script src="../../js/global/fetch.js" defer></script>

        <!-- Validação de inputs -->
        <script src="../../js/cadastroUsuario/validacaoCadastroDadosPessoais.js" defer></script>
        <script src="../../js/cadastroUsuario/validacaoCadastroEndereco.js" defer></script>
        <script src="../../js/cadastroUsuario/passarEtapas.js" defer></script>
        
        <!-- Cadastro de usuário -->
        <script src="../../js/API/cadastroUsuario.js" defer></script>
    </head>
    
    <body class="fundo__form">
        <main>
            <form method="post" id="cadastro_usuario" class="container py-5 d-flex justify-content-center align-items-center">
                <div class="col-12 col-md-8 col-lg-6 col-xl-5">
                    <div class="card-body p-5 text-center text-white shadow rounded fundo__escuro">
                        <!-- Logo BWarts -->
                        <img src="../../img/assets/Logo.svg" alt="Logo BWarts" class="logo">

                        <!-- Inputs do usuário -->
                        <div class="my-3">
                            <h4 class="mb-3 mt-0 text-uppercase fs-6">Cadastre-se</h4>

                            <!-- Etapas do cadastro --> 
                            <div class="d-flex justify-content-center align-items-center w-100 mb-4 gap-2">
                                <div class="d-flex flex-column align-items-center" style="width: 70px !important;">
                                    <i id="icone_etapa1" class="bi bi-1-circle fs-3"></i>
                                    <span id="texto_icone_etapa1">Perfil</span>
                                </div>
                                
                                <hr class="flex border-3" style="width: 120px;">
                                
                                <div class="d-flex flex-column align-items-center" style="width: 70px !important;">
                                    <i id="icone_etapa2" class="bi bi-2-circle fs-3"></i>
                                    <span id="texto_icone_etapa2">Endereço</span>
                                </div>
                            </div>
                            
                            <!-- ETAPA 1 - DADOS PESSOAIS -->
                            <div id="etapa1">
                                <!-- Nome -->
                                <div class="mb-3">
                                    <input type="text" id="nome_user" name="nome_user" placeholder="Nome de usuário" class="form-control" required/>
                                    <span class="erro" id="erro_nome"></span>
                                </div>

                                <!-- E-mail -->
                                <div class="mb-3">
                                    <input type="email" id="email_user" name="email_user" placeholder="E-mail" class="form-control" required/>
                                    <span class="erro" id="erro_email"></span>
                                </div>

                                <!-- Data de nascimento -->
                                <div class="mb-3">
                                    <input type="date" id="dataNasc_user" name="dataNasc_user" placeholder="Data de nascimento" class="form-control" required/>
                                    <span class="erro" id="erro_dataNasc_user"></span>
                                </div>

                                <!-- CPF, DDD, Telefone -->
                                <div class="row g-2 mb-3">
                                    <div class="col-5">
                                        <input type="tel" id="cpf_user" name="cpf_user" placeholder="CPF" class="form-control" required/>
                                    </div>
                                    <div class="col-2">
                                        <input type="tel" id="ddd_telefone" name="ddd_telefone" placeholder="DDD" class="form-control" required/>
                                    </div>
                                    <div class="col-5">
                                        <input type="tel" id="numero_telefone" name="numero_telefone" placeholder="Telefone" class="form-control" required/>
                                    </div>
                                    <span class="erro" id="erro_cpf"></span>
                                    <span class="erro" id="erro_cpf_formato"></span>
                                    <span class="erro" id="erro_ddd"></span>
                                    <span class="erro" id="erro_telefone"></span>
                                </div>

                                <!-- Senha -->
                                <div class="row g-2">
                                    <div class="col">
                                        <input type="password" id="senha_user" name="senha_user" placeholder="Senha" class="form-control" required/>
                                    </div>
                                    <div class="col">
                                        <input type="password" id="confirmar_senha" name="confirmar_senha" placeholder="Confirmar senha" class="form-control" required/>
                                    </div>
                                </div>
                                <p class="text-start text-white-50 lh-1 mt-1 mb-1 obs__senha" style="font-size: 0.8rem;">Senha deve ter no mínimo: 8 caracteres, um número, uma letra minúscula e uma letra maiúscula.</p>
                                <span class="erro" id="erro_senha_fraca"></span>
                                <span class="erro" id="erro_senha_tamanho"></span>
                                <span class="erro" id="erro_confirmar"></span>

                                <!-- Botão para passar para próxima página -->
                                <div class="mt-3 d-flex w-100 justify-content-end">
                                    <button class="btn text-white btn-outline px-3 border-2 botao__form" id="botao_proxima_etapa" type="button">
                                        Próximo<i class="bi bi-arrow-right-short"></i>
                                    </button>
                                </div>
                            </div>

                            <!-- ETAPA 2 - ENDEREÇO -->
                            <div id="etapa2" style="display: none;">
                                <!-- Nome da rua -->
                                <div class="mb-3">
                                    <input type="text" id="nome_rua" name="nome_rua" placeholder="Rua" class="form-control" required />
                                    <span class="erro" id="erro_nome_rua"></span>
                                </div>

                                <!-- Número do endereço e nome do bairro -->
                                <div class="row g-2 mb-3">
                                    <div class="col-6">
                                        <input type="text" id="numero_endereco" name="numero_endereco" placeholder="Número" class="form-control" required />
                                    </div>
                                    <div class="col-6">
                                        <input type="text" id="nome_bairro" name="nome_bairro" placeholder="Bairro" class="form-control" required />
                                    </div>
                                    <span class="erro" id="erro_nome_bairro"></span>
                                </div>

                                <!-- Nome da cidade e sigla do estado -->
                                <div class="row g-2 mb-3">
                                    <div class="col-8">
                                        <input type="text" id="nome_cidade" name="nome_cidade" placeholder="Cidade" class="form-control" required />
                                    </div>
                                    <div class="col-4">
                                        <input type="text" id="nome_estado" name="nome_estado" placeholder="UF" class="form-control" required />
                                    </div>
                                    <span class="erro" id="erro_nome_cidade"></span>
                                    <span class="erro" id="erro_nome_estado"></span>
                                </div>

                                <!-- CEP -->
                                <div class="mb-3">
                                    <input type="text" id="cep_endereco" name="cep_endereco" placeholder="CEP" class="form-control" required />
                                    <span class="erro" id="erro_cep_endereco"></span>
                                </div>
                                
                                <!-- Botão voltar e confirmar cadastro -->
                                <div class="mt-3 d-flex w-100 justify-content-between">
                                    <button class="btn text-white btn-outline px-3 border-2 botao__form" id="botao_voltar_etapa" type="button">
                                        <i class="bi bi-arrow-left-short"></i>Voltar
                                    </button>
                                    <button class="btn text-white btn-outline px-3 border-2 botao__form" id="botao_cadastrar" type="submit">
                                        Cadastrar
                                    </button>
                                </div>
                            </div>
                        </div>

                        <!-- Realizar login -->
                        <div>
                            <p class="mb-0">Já possui conta? <a href="form_login.html" class="text-decoration-none">Faça login</a></p>
                        </div>

                        <!-- Divisória "-ou-" -->
                        <div class="d-flex align-items-center gap-2 my-2">
                            <hr class="flex-grow-1 m-0">
                            <p class="m-0">ou</p>
                            <hr class="flex-grow-1 m-0">
                        </div>

                        <!-- Cadastros alternativos -->
                        <div class="d-grid gap-2">
                            <button class="btn btn-outline-light" id="botao_login_google" type="button"><img src="../../img/forms/google.png" alt="Logo google" width="30rem;"> Entre com o Google</button>
                            <button class="btn btn-outline-light" id="botao_login_facebook" type="button"><img src="../../img/forms/facebook_cadastro.svg" alt="Logo facebook" width="30rem;"> Entre com o Facebook</button>
                        </div>
                    </div>
                </div>
            </form>
        </main>
    </body>
</html>
