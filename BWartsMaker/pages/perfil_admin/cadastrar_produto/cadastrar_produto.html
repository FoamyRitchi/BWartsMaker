<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <!-- Configurações iniciais -->
        <script src="../../../js/global/include.js" defer></script>
        <script src="../../../js/global/fetch.js" defer></script>
        
        <!-- Estilização -->
        <link rel="stylesheet" href="../../styles/perfil.css">
        <link rel="stylesheet" href="cadastrar_produto.css">

        <!-- Animação sidebar -->
        <script src="../../../js/global/recolherSidebar.js" defer></script>        
        <script src="../../../js/global/modalSairConta.js" defer></script>
             
        <!-- Listar as imagens ao dar input -->
        <script src="../../../js/perfil_admin/cadastro_produto/listarImagens.js" defer></script>
        <!-- Cancelar ou confirmar cadastro do produto pelo modal -->
        <script src="../../../js/perfil_admin/cadastro_produto/confirmarCancelarCadastro.js" defer></script>

        <script src="../../../js/API/produto/cadastraProduto.js" defer></script>
    </head>

    <body>
        <section id="header"></section>

        <section class="d-flex" style="min-height: 100vh;">
            <!-- SIDEBAR -->
            <nav class="pt-4 d-flex flex-column align-items-center flex-shrink-0" id="sidebar">
                <!-- Botão para recolher a sidebar -->
                <div class="w-100 d-flex justify-content-end pe-3">
                    <button class="botao_recolher" id="botao_recolher_menu">
                        <i class="bi bi-chevron-left" id="sidebar_icone"></i>
                    </button>
                </div>

                <!-- Links para outras páginas -->
                <ul class="p-0 pt-3 w-100 links__sidebar">
                    <li class="pb-2"><span class="fs-5 d-flex flex-wrap fw-bold text-white text-uppercase titulo__sidebar">Páginas - admin</span></li>
                    <li>
                        <a href="../vendas/vendas.html">
                            <span class="fs-5 link__sidebar">Vendas</span>
                        </a>
                    </li>
                    <li>
                        <a href="#" class="active">
                            <span class="fs-5 link__sidebar">Cadastrar produto</span>
                        </a>
                    </li>
                    <li>
                        <a href="../produtos/produtos.html">
                            <span class="fs-5 link__sidebar">Lista de produtos</span>
                        </a>
                    </li>
                    <li>
                        <a>
                            <button type="button" id="botao_sair" class="btn link-light p-0 fs-5 link__sidebar" onclick="exibirModalSairConta()">
                                Sair da conta
                            </button>
                        </a>
                    </li>
                </ul>
            </nav>

            <!-- Cadastro de produto -->
            <main class="flex-grow-1 p-2 p-sm-5">
                <h1 class="h4 fw-bold pb-1 divisoria__titulo">Cadastro de produto</h1>

                <div class="w-100 rounded-4 p-4 sombra__card">
                    <form id="form_cadastrar_produto" action="#" method="post" class="d-flex">
                        <div class="container">
                            <div class="row">
                                <!-- Imagem do produto -->
                                <div class="col-4">
                                    <div class="mb-3">
                                        <labe class="form-label">Imagens do produto</label>
                                        <input class="form-control" type="file" id="input_imagem" accept="image/png, image/jpeg" multiple>
  
                                        <div class="d-flex flex-wrap gap-2 mt-3 input__imagem__lista"></div>
                                    </div>  
                                </div>

                                <!-- Informações do produto -->
                                <div class="col-8 pb-3">
                                    <div class="row g-2">
                                        <input type="hidden">
                                        <input type="hidden">
                                        <input type="hidden">

                                        <!-- Nome do produto -->
                                        <div class="col-8">
                                            <label>Nome do produto</label>
                                            <input type="text" id="nome_prod" class="form-control" placeholder="Nome do produto">
                                        </div>
                                        
                                        <!-- Categoria do produto -->
                                        <div class="col-4">
                                            <label>Categoria</label>
                                            <div class="input-group">
                                                <select class="form-select" id="categoria_prod" placeholder="selecione">
                                                    <option selected>Selecione</option>
                                                    <option value="1">Chaveiro</option>
                                                    <option value="2">Decoração</option>
                                                    <option value="3">Utilidade</option>
                                                </select>
                                                <button class="btn" type="button" title="Adicionar categoria" style="border: 1px solid #88888860;">+</button>
                                            </div>
                                        </div>

                                        <!-- Valor unitário -->
                                        <div class="col-6">
                                            <label>Preço (R$)</label>
                                            <input type="number" min="1" id="valor_prod" class="form-control" placeholder="R$0,00">
                                        </div>

                                        <!-- Quantidade disponível -->
                                        <div class="col-6">
                                            <label>Estoque</label>
                                            <input type="number" min="1" id="qntd_prod" class="form-control" placeholder="0">
                                        </div>

                                        <!-- Descrição do produto -->
                                        <div class="col-12 pb-3" style="border-bottom: 2px solid #E0E0E0;">
                                            <label>Descrição</label>
                                            <textarea class="form-control" id="desc_prod" placeholder="Descreva detalhes, materiais, dimensões..." style="height: 100px;"></textarea>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </form> 

                    <!-- Botões de envio e cancelamento -->
                    <div class="d-flex justify-content-end gap-3 mt-1">
                        <button id="botao_cancelar_cadastro" class="btn text-black px-3 botao__cancelar" type="button">Cancelar</button>
                        <button id="botao_cadastrar_produto" class="btn text-white btn-outline px-3 border-2 botao__preto__laranja" type="submit" data-bs-toggle="modal" data-bs-target="#modal_confirmar_cadastro_produto">Cadastrar produto</button>
                    </div>
                </div>

                <!-- Modal para confirmar cadastro de produto -->
                <div class="modal fade" id="modal_confirmar_cadastro_produto" tabindex="-1">
                    <div class="modal-dialog modal-dialog-scrollable">
                        <div class="modal-content">
                            <!-- Header do modal -->
                            <div class="modal-header fundo__escuro">
                                <div class="d-flex justify-content-center modal-body">
                                    <img src="../../../img/assets/Logo.svg" alt="Logo da BWarts" style="width: 13rem;">
                                </div>
                                <button id="fechar_modal_confimar_cadastro_produto" type="button" class="btn-close" data-bs-theme="dark" data-bs-dismiss="modal"></button>
                            </div>
                            
                            <!-- Corpo do modal -->
                            <div class="modal-body d-flex flex-column align-items-center text-center px-4 py-4 gap-3">
                                <!-- Ícone -->
                                <div class="rounded-circle d-flex align-items-center justify-content-center"
                                    style="width:72px; height:72px; background:#fff5e6; border: 2px solid #FF8E1C;">
                                    <i class="bi bi-clipboard2-check" style="font-size:2rem; color:#FF8E1C;"></i>
                                </div>

                                <!-- Texto -->
                                <div>
                                    <h1 class="fw-bold mb-1 fs-4" style="color:#222;">
                                        Confirmar cadastro de produto?
                                    </h1>
                                </div>

                                <!-- Botões de confirmação -->
                                <div class="d-flex gap-2 modal-body">
                                    <button id="botao_modal_cancelar_cadastro_produto" type="button" class="btn btn-outline-danger"><i class="bi bi-x-circle-fill"></i> Cancelar</button>
                                    <button id="botao_modal_confirmar_cadastro_produto" type="button" class="btn btn-success" data-bs-dismiss="modal"><i class="bi bi-check-circle-fill"></i> Confirmar</button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </main>
        </section>

        <section id="footer"></section>
    </body>
</html>
