<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <!-- Configurações iniciais -->
        <script src="../../../js/global/include.js" defer></script>
        <script src="../../../js/global/fetch.js" defer></script>
        
        <!-- Estilização -->
        <link rel="stylesheet" href="../../styles/perfil.css">
        <link rel="stylesheet" href="produtos.css">

        <!-- Animação sidebar -->
        <script src="../../../js/global/recolherSidebar.js" defer></script>
        <script src="../../../js/global/modalSairConta.js" defer></script>
        
        <script src="../../../js/API/produto/listarProduto.js" defer></script>
    </head>

    <body>
        <section id="header"></section>

        <section class="d-flex" style="min-height: 100vh;">
            <!-- SIDEBAR -->
            <nav class="pt-4 d-flex flex-column align-items-center flex-shrink-0" id="sidebar">
                <!-- Botão para recolher a sidebar -->
                <div class="w-100 d-flex justify-content-end pe-3">
                    <button class="botao_recolher" id="botao_recolher_menu">
                        <i class="bi bi-chevron-left" id="sidebar_icone"></i>
                    </button>
                </div>

                <!-- Links para outras páginas -->
                <ul class="p-0 pt-3 w-100 links__sidebar">
                    <li class="pb-2"><span class="fs-5 d-flex flex-wrap fw-bold text-white text-uppercase titulo__sidebar">Páginas - Admin</span></li>
                    <li>
                        <a href="../vendas/vendas.html">
                            <span class="fs-5 link__sidebar">Vendas</span>
                        </a>
                    </li>
                    <li>
                        <a href="../cadastrar_produto/cadastrar_produto.html">
                            <span class="fs-5 link__sidebar">Cadastrar produto</span>
                        </a>
                    </li>
                    <li>
                        <a href="#" class="active">
                            <span class="fs-5 link__sidebar">Lista de produtos</span>
                        </a>
                    </li>
                    <li>
                        <a>
                            <button type="button" id="botao_sair" class="btn link-light p-0 fs-5 link__sidebar" onclick="exibirModalSairConta()">
                                Sair da conta
                            </button>
                        </a>
                    </li>
                </ul>
            </nav>

            <!-- Lista dos produtos cadastrados -->
            <main class="flex-grow-1 p-2 p-sm-5">
                <h1 class="h4 fw-bold pb-1 divisoria__titulo">Produtos cadastrados</h1>

                <div class="w-100 rounded-4 mt-3 p-4 sombra__card">

                    <!-- Search bar e botão de procura -->
                    <div class="d-flex justify-content-between pb-2 mb-3">
                        <search class="d-flex align-items-center gap-2">
                            <i class="bi bi-search fs-6" style="color: #535353;"></i>
                            <input class="form-control me-2 opacity-75 w-100" type="search" placeholder="Buscar por nome..."/>
                        </search>

                        <button class="btn text-white fw-bold botao__laranja" onclick="window.location.href='../cadastrar_produto/cadastrar_produto.html'" style="font-size: 0.8rem;">
                            <i class="bi bi-plus"></i> Novo produto
                        </button>
                    </div>
                    
                    <div class="tabela scroll pe-3">
                        <!-- Produtos cadastrados -->
                        <table class="table table-hover align-middle">
                            <!-- colunas -->
                            <thead>
                                <tr>
                                    <th scope="col">ID</th>
                                    <th scope="col">Produto</th>
                                    <th scope="col">Categoria</th>
                                    <th scope="col" class="text-center">Preço</th>
                                    <th scope="col" class="text-center">Estoque</th>
                                    <th scope="col" class="text-center">Status</th>
                                    <th scope="col" class="text-center">Ações</th>
                                </tr>
                            </thead>

                            <!-- Linhas -->
                            <tbody id="tabela_produtos">
                            </tbody>
                        </table>
                    </div>
                </div>
            </main>
        </section>

        <section id="footer"></section>
    </body>
</html>
